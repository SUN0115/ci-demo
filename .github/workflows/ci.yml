name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 檢查程式風格
        run: npm run lint

      - name: 跑測試
        run: npm test

      - name: 編譯
        run: npm run build