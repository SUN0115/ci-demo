name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ═════════ 第一段：CI 檢查 ═════════
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 檢查程式風格
        run: npm run lint

      - name: 跑測試
        run: npm test

      - name: 編譯
        run: npm run build

  # ═════════ 第二段：進 main 才打包 image ═════════
  build-image:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 決定 image 名稱（ghcr 只接受小寫）
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 準備 Docker 打包工具
        uses: docker/setup-buildx-action@v3

      - name: 登入 GitHub 的 image 倉庫
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包並推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max